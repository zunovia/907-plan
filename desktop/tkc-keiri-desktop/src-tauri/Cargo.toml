[package]
name = "tkc-keiri-desktop"
version = "0.1.0"
description = "TKC AI 仕訳インポートツール デスクトップ版"
authors = ["Sur Communication"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tkc_keiri_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
